# Releases manifest.json's version when main gets it. main takes changes only through a
# pull request from preview whose checks pass, so a push to main is a release candidate:
# when no release has this version yet, this job checks the plugin again, tags the commit,
# and publishes main.js, manifest.json, and styles.css, which Obsidian's community plugins
# download. When the version is released already (a change to the docs, say), it stops.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version, and whether it is released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Version $version is released already; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A unit test runs the agent's start command in /bin/zsh, the shell of macOS.
      - if: steps.version.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm run lint
      - if: steps.version.outputs.new == 'true'
        run: npm run build
      - if: steps.version.outputs.new == 'true'
        run: npm test

      - name: Attest the build provenance
        if: steps.version.outputs.new == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Tag the commit and publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Almagest for Obsidian $VERSION. It needs the almagest binary of the same protocol; see the README." \
            dist/main.js dist/manifest.json dist/styles.css
