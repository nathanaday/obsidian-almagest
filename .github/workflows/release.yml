# Publishes the plugin's files when a version tag is pushed. Obsidian's community plugins
# download main.js, manifest.json, and styles.css from the release whose tag is the
# version in manifest.json on main, so push the tag, wait for this job, then push main.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches manifest.json and versions.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in manifest.json."
            exit 1
          fi
          node -e "const v = require('./versions.json'); if (!v[process.argv[1]]) { console.error('versions.json has no entry for ' + process.argv[1]); process.exit(1); }" "$version"

      # A unit test runs the agent's start command in /bin/zsh, the shell of macOS.
      - run: sudo apt-get update && sudo apt-get install -y zsh

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Almagest for Obsidian $GITHUB_REF_NAME. It needs the almagest binary of the same protocol; see the README." \
            --verify-tag \
            dist/main.js dist/manifest.json dist/styles.css
