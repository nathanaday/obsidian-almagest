name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A unit test runs the agent's start command in /bin/zsh, the shell of macOS.
      - run: sudo apt-get update && sudo apt-get install -y zsh

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
