# The checks of every change: on preview, and on each pull request into main, which needs
# them to pass before it merges.
name: CI

on:
  push:
    branches: [preview]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A unit test runs the agent's start command in /bin/zsh, the shell of macOS.
      - run: sudo apt-get update && sudo apt-get install -y zsh

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # main takes pull requests from preview alone; GitHub's rules cannot name the source
  # branch, so this check, which the ruleset of main requires, does.
  from-preview:
    name: from preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = main ] && [ "$HEAD" != preview ]; then
            echo "main takes pull requests from preview only, not from $HEAD."
            exit 1
          fi
